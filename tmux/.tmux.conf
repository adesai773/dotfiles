# --- General Settings ---
set -g default-terminal "screen-256color" # Enable 256 colors
set -g mouse on                           # Enable mouse support (click, resize)
set -g base-index 1                       # Start window numbering at 1
setw -g pane-base-index 1                 # Start pane numbering at 1
set -g renumber-windows on                # Renumber windows when one is closed
set -g history-limit 100000                # Increase scrollback buffer

# --- Keybindings ---
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split panes using | and - (more intuitive)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config file with Prefix + r
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Visuals ---
# Design the status bar (simple and clean)
set -g status-style bg=default
set -g status-left "#[fg=blue,bold]#S "
set -g status-right "#[fg=magenta]%H:%M #[fg=green]%d-%b-%y"
setw -g window-status-current-style fg=white,bg=blue,bold

